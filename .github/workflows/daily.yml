name: Daily market dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests
      - run: python Build_dashboard.py
      - name: Save the new page
        run: |
          git config user.name 'dashboard-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Daily update' || echo 'No changes'
          git push
